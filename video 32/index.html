<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gride</title>
    <style>
        .container {
            border: 2px solid yellow;
            display: grid;
            grid-template-columns:[f]100px [s]120px ;
            grid-template-rows: [f]50px  [s]50px [t]50px auto;

        }

        .item {
            border: 2px solid red;
            height: 20px;
            width: 20px;
            margin: 2px;

        }

        .item-3 {
            grid-row: f/t;
            gride-column: f/s;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item item-3">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>

    </div>


</body>

</html>
